[build-system]
requires = ["scikit-build-core>=0.11,<1", "setuptools-scm>=9,<10", "patchelf>=0.17; sys_platform == 'linux'"]
build-backend = "scikit_build_core.build"

[project]
name = "intentdsl"
dynamic = ["version"]
description = "A structured kernel DSL with native compilation across execution models"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
manual = ["mcp>=1.28,<2"]

[project.scripts]
intent = "intent.tools.cli:main"
intent-manual = "intent.tools.manual:main"
intent-compiler-mcp = "intent.tools.compiler_mcp:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
build.targets = ["intent-compile", "intent-opt"]
install.components = ["IntentRuntime"]
wheel.packages = ["python/intent"]
wheel.py-api = "py3"
sdist.exclude = [".codegraph", "experiments", "report", "tasks"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --match *[0-9]*"
