  <title id="title">IntentDSL workflow</title>
  <desc id="description">Developers and agents write an IntentDSL program describing tensor and region computation, accesses, state, and composition rules. The compiler maps and optimizes this program into inspectable Triton and cuTile source for GPUs, Mojo source for x86 CPUs, Weft source for RISC-V CPUs, and BANG C source for Cambricon MLUs.</desc>
